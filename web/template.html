<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="theme-color" content="#101010">
  <title>{{TITLE}}</title>
  <link rel="icon" type="image/svg+xml" href="{{BASE}}/assets/favicon.svg">
  <link rel="preload" href="{{BASE}}/assets/fonts/geist-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{BASE}}/assets/styles.css">
  <script src="{{BASE}}/assets/app.js" defer></script>
</head>
<body class="{{PAGE_CLASS}}" data-root="{{BASE}}/" id="top">
  <a class="skip-link" href="#main-content">Saltar al contenido</a>
  <header class="site-header">
    <div class="topbar">
      <a class="brand" href="{{BASE}}/" aria-label="LCast Homelab, inicio"><span class="brand-mark" aria-hidden="true">/</span><span>LCast<br>Homelab</span></a>
      <nav class="site-nav" id="site-navigation" aria-label="Páginas de documentación">{{NAVIGATION}}</nav>
      <div class="nav-actions"><button class="search-trigger" data-search-open type="button" aria-label="Buscar documentación"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.5 15.5 5 5"></path></svg></button><a class="github-link" href="{{GITHUB}}">GitHub <span aria-hidden="true">↗</span></a><button class="menu-toggle" type="button" aria-label="Abrir navegación" aria-expanded="false" aria-controls="site-navigation"><span></span><span></span></button></div>
    </div>
  </header>
  <main class="main" id="main-content" tabindex="-1"><div class="breadcrumb">{{BREADCRUMB}}</div>{{HERO}}<div class="reading-layout"><div class="reading-column"><article class="prose">{{CONTENT}}</article>{{PAGE_NAVIGATION}}</div>{{TOC}}</div></main>
  <footer class="site-footer"><div class="footer-inner"><a class="footer-brand" href="{{BASE}}/">LCast Homelab</a><p>Aprender, adaptar y replicar.</p><a href="{{GITHUB}}">Código y documentación <span aria-hidden="true">↗</span></a></div></footer>
  <dialog class="search-dialog" aria-labelledby="search-title"><div class="search-heading"><h2 id="search-title">Buscar en la documentación</h2><button class="search-close" type="button" aria-label="Cerrar búsqueda">×</button></div><div class="search-input-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m15.5 15.5 5 5"></path></svg><input id="search-input" type="search" autocomplete="off" placeholder="Hardware, servicios, backups…" aria-label="Texto a buscar" aria-describedby="search-status"></div><p class="search-status" id="search-status" role="status">Busca por tema o palabra.</p><div class="search-results"></div><div class="search-hint"><span><kbd>Esc</kbd> para cerrar</span><span><kbd>/</kbd> para buscar</span></div></dialog>
</body>
</html>
